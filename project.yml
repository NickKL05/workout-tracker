name: WorkoutTracker
options:
  bundleIdPrefix: com.workouttracker
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_LANGUAGE: en
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  WorkoutTracker:
    type: application
    platform: iOS
    sources:
      - path: WorkoutTracker
    info:
      path: WorkoutTracker/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Dark
        CFBundleIconName: AppIcon
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDisplayName: SplitMax
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nickkl.workouttracker
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
