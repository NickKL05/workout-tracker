name: TestFlight Build

on:
  workflow_dispatch:        # lets you trigger manually from the Actions tab
  push:
    branches: [main]
    paths:
      - 'WorkoutTracker/**'
      - 'project.yml'
      - 'ExportOptions.plist'
      - '.github/workflows/testflight.yml'

env:
  XCODE_PROJECT: WorkoutTracker.xcodeproj
  SCHEME: WorkoutTracker
  ARCHIVE_PATH: build/WorkoutTracker.xcarchive
  EXPORT_PATH: build/export
  BUNDLE_ID: com.nickkl.workouttracker    # change here if you change project.yml

jobs:
  build-and-upload:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Select latest-stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate app icon
        run: |
          python3 -m pip install --quiet --upgrade --break-system-packages --user Pillow
          python3 scripts/generate-icon.py
          ls -l WorkoutTracker/Assets.xcassets/AppIcon.appiconset/

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Dump generated Info.plist (debug)
        run: |
          echo "=== WorkoutTracker/Info.plist content ==="
          cat WorkoutTracker/Info.plist
          echo "=== end ==="

      - name: Import code-signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.DIST_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.DIST_CERTIFICATE_PASSWORD }}

      - name: Download App Store provisioning profile
        id: profile
        uses: apple-actions/download-provisioning-profiles@v3
        with:
          bundle-id: ${{ env.BUNDLE_ID }}
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      - name: Resolve provisioning profile name
        id: profile_name
        run: |
          set -e
          # Xcode 16+ moved profiles. Check both locations.
          DIRS=(
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
            "$HOME/Library/MobileDevice/Provisioning Profiles"
          )
          PROFILE_FILE=""
          for d in "${DIRS[@]}"; do
            echo "Checking: $d"
            if [ -d "$d" ]; then
              ls -la "$d" || true
              CANDIDATE=$(ls -t "$d"/*.mobileprovision 2>/dev/null | head -n1 || true)
              if [ -n "$CANDIDATE" ]; then
                PROFILE_FILE="$CANDIDATE"
                break
              fi
            else
              echo "  (does not exist)"
            fi
          done

          if [ -z "$PROFILE_FILE" ]; then
            echo "No .mobileprovision files found in any known location." >&2
            exit 1
          fi
          echo "Using profile: $PROFILE_FILE"

          # Extract the plist payload. Try security cms first; fall back to openssl.
          TMP_PLIST=$(mktemp)
          if ! security cms -D -i "$PROFILE_FILE" > "$TMP_PLIST" 2>/dev/null || [ ! -s "$TMP_PLIST" ]; then
            echo "security cms produced no output, falling back to openssl"
            openssl smime -inform der -verify -noverify -in "$PROFILE_FILE" > "$TMP_PLIST" 2>/dev/null
          fi
          if [ ! -s "$TMP_PLIST" ]; then
            echo "Failed to decode profile $PROFILE_FILE" >&2
            exit 1
          fi
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$TMP_PLIST")
          echo "Profile name: $PROFILE_NAME"
          echo "profile_name=$PROFILE_NAME" >> $GITHUB_OUTPUT

      - name: Inject team ID + bundle ID + profile name into ExportOptions.plist
        run: |
          sed -i '' "s/__TEAM_ID__/${{ secrets.APPLE_TEAM_ID }}/g" ExportOptions.plist
          sed -i '' "s|__BUNDLE_ID__|${{ env.BUNDLE_ID }}|g" ExportOptions.plist
          sed -i '' "s|__PROFILE_NAME__|${{ steps.profile_name.outputs.profile_name }}|g" ExportOptions.plist
          cat ExportOptions.plist

      - name: Build archive
        run: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            PRODUCT_BUNDLE_IDENTIFIER=${{ env.BUNDLE_ID }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="${{ steps.profile_name.outputs.profile_name }}" \
            archive

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist ExportOptions.plist

      - name: Locate IPA
        id: ipa
        run: |
          IPA_FILE=$(find "$EXPORT_PATH" -name "*.ipa" | head -n1)
          echo "Path: $IPA_FILE"
          echo "ipa_path=$IPA_FILE" >> $GITHUB_OUTPUT

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ steps.ipa.outputs.ipa_path }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
